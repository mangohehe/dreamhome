<!DOCTYPE html>
<html lang="en" style="scroll-behavior: smooth;">
<head>
    <meta charset="utf-8" />
    <title>MSZ Construction | 20+ Years Bay Area Custom Homes, Additions & Remodeling</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="MSZ Construction — California Licensed Class-B General Contractor with 20+ years of Bay Area building experience, fair & transparent pricing, in-house architectural design, factory-direct custom millwork & stone, and dedicated master trade teams." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            margin: 0;
            padding: 0;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
            font-family: 'Plus Jakarta Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #FAF8F5;
            color: #1A1F26;
        }

        button:focus-visible, a:focus-visible {
            outline: 2px solid #C5A880 !important;
            outline-offset: 2px;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ::selection {
            background-color: #E8DFD3;
            color: #1A1F26;
        }
    </style>
</head>
